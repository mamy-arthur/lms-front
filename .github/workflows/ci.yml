name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

  format:
    name: Format Check (Prettier)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check
  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run type-check

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

  # Images staging et production, déployées par le dépôt parent LEARNEO
  # (.github/workflows/deploy.yml) via le tag "<environnement>-<sha>" du commit
  # pointé par son sous-module learneo-fe. Les NEXT_PUBLIC_* sont figées dans le
  # bundle au build : une image par environnement. Les deux sont construites à
  # chaque push sur dev, pour que la promotion en production (merge dev → main
  # du dépôt parent) déploie exactement les commits validés en staging.
  build-and-push:
    name: Build & push ${{ matrix.environment }} image
    needs: [lint, format, type-check, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    strategy:
      # Une configuration de production incomplète ne bloque pas le staging.
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Check build variables
        env:
          NEXT_PUBLIC_BASE_DOMAIN: ${{ vars.NEXT_PUBLIC_BASE_DOMAIN }}
          NEXT_PUBLIC_REVERB_APP_KEY: ${{ vars.NEXT_PUBLIC_REVERB_APP_KEY }}
        run: |
          missing=""
          [ -n "$NEXT_PUBLIC_BASE_DOMAIN" ] || missing="$missing NEXT_PUBLIC_BASE_DOMAIN"
          [ -n "$NEXT_PUBLIC_REVERB_APP_KEY" ] || missing="$missing NEXT_PUBLIC_REVERB_APP_KEY"
          [ -z "$missing" ] || { echo "::error::Variables absentes de l'environnement ${{ matrix.environment }} :$missing"; exit 1; }

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.environment }}-${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ matrix.environment }}-latest
          build-args: |
            NEXT_PUBLIC_BASE_DOMAIN=${{ vars.NEXT_PUBLIC_BASE_DOMAIN }}
            NEXT_PUBLIC_REVERB_APP_KEY=${{ vars.NEXT_PUBLIC_REVERB_APP_KEY }}
            NEXT_PUBLIC_LOCATIONIQ_API_KEY=${{ secrets.NEXT_PUBLIC_LOCATIONIQ_API_KEY }}
          cache-from: type=gha,scope=${{ matrix.environment }}
          cache-to: type=gha,scope=${{ matrix.environment }},mode=max

      # Image de staging publiée : le dépôt parent LEARNEO fait pointer son
      # sous-module learneo-fe sur ce commit, ce qui redéploie le staging.
      - uses: actions/create-github-app-token@v2
        if: matrix.environment == 'staging'
        id: learneo-token
        with:
          app-id: ${{ vars.LEARNEO_BOT_APP_ID }}
          private-key: ${{ secrets.LEARNEO_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: learneo

      - name: Notify LEARNEO
        if: matrix.environment == 'staging'
        env:
          GH_TOKEN: ${{ steps.learneo-token.outputs.token }}
        run: |
          gh api "repos/${{ github.repository_owner }}/learneo/dispatches" \
            -f event_type=submodule-updated \
            -f 'client_payload[submodule]=learneo-fe' \
            -f 'client_payload[sha]=${{ github.sha }}'
