services:
  app:
    container_name: laravel-fe
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - WATCHPACK_POLLING=true
    # Permet d'atteindre le host depuis le container (Linux Docker Engine)
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - learneo-network


networks:
    learneo-network:
      external: true
