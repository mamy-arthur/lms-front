services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time : injecté dans le bundle JS client
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    # Permet d'atteindre le host depuis le container (Linux Docker Engine)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
